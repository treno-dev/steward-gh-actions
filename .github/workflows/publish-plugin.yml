name: Publish plugin

# Publishes the docs of a plugin to the Steward registry when a tag `v<version>` is pushed. The job proves where it runs
# with the OIDC token that GitHub issues for it, so it needs no secret. The calling job must allow `id-token: write`.
on:
  workflow_call:
    inputs:
      pluginId:
        description: The id of the plugin in the registry
        type: string
        required: true
      docs:
        description: The folder with the markdown pages of the docs
        type: string
        default: docs
      registry:
        description: The address of the registry
        type: string
        default: https://steward.treno.dev/registry

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: treno-dev/steward-gh-actions/actions/publish-plugin@v1
        with:
          plugin-id: ${{ inputs.pluginId }}
          docs: ${{ inputs.docs }}
          registry: ${{ inputs.registry }}
