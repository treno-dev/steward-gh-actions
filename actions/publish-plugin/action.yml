name: Publish plugin
description: Zips the docs of a plugin and sends them to Steward with the OIDC token of the job.

inputs:
  plugin-id:
    description: The id of the plugin in Steward
    required: true
  docs:
    description: The folder with the markdown pages of the docs
    default: docs
  steward:
    description: The address of Steward
    default: https://steward.treno.dev
  audience:
    description: What the OIDC token is for, which Steward checks
    default: https://steward.treno.dev

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24

    - shell: bash
      env:
        INPUTS: ${{ toJSON(inputs) }}
      run: node "${{ github.action_path }}/dist/index.js" plugin publish
